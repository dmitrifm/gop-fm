[project]
name = "gop-fm-tts"
version = "0.1.0"
description = "FastAPI microservice for multilingual Chatterbox TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chatterbox-tts>=0.1.4",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "ruaccent",
    "setuptools>=70.0.0,<81.0.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
